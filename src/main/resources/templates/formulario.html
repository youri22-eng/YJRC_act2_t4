<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
    </style>
</head>
<body>
    <h1 th:text="'Proyecto: ' + ${proyecto}">Proyecto</h1>
    <h3 th:text="'Autor: ' + ${autor}">Autor</h3>

    <h2 th:text="${titulo}">Nuevo producto</h2>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <p>
            <label>Nombre: </label>
            <input type="text" th:field="*{nombre}">
        </p>
        <p>
            <label>Precio: </label>
            <input type="number" step="0.01" th:field="*{precio}">
        </p>
        <p>
            <label>Categoria: </label>
            <select th:field="*{categoria}">
                <option value="Tecnologia">Tecnologia</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Papeleria">Papeleria</option>
            </select>
        </p>
        <button type="submit">Guardar</button>
    </form>

    <p><a th:href="@{/productos}">Volver a la lista</a></p>
</body>
</html>
